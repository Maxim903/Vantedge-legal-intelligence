name: 🐳 Build & Deploy Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'pipeline/**'
      - '.github/workflows/deploy-pipeline.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: europe-west9-docker.pkg.dev
  IMAGE_NAME: vil-pipeline
  PROJECT_ID: test-barometre-juridique
  REGION: europe-west9

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 🏗️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🐳 Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: 🔨 Build Docker image
        run: |
          docker build \
            -f pipeline/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: 📤 Push to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set output image
        id: image
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: ✅ Verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud artifacts docker images list ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}

  deploy-jobs:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 🏗️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🚀 Deploy Cloud Run Jobs
        run: |
          # Update or create each job
          for job in vil-load-corpus vil-extract-notions vil-gap-analysis; do
            gcloud run jobs update $job \
              --image=${{ needs.build-and-push.outputs.image }} \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --service-account=vil-jobs-runner@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
              2>/dev/null || \
            gcloud run jobs create $job \
              --image=${{ needs.build-and-push.outputs.image }} \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --service-account=vil-jobs-runner@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          done

      - name: 📋 Verify deployment
        run: |
          gcloud run jobs list --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }}
