name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-web:
    runs-on: ubuntu-latest
    outputs:
      web_exists: ${{ steps.check.outputs.web_exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f apps/web/package.json ]; then
            echo "web_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_exists=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pipeline/pyproject.toml
            pipeline/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: pipeline
        run: uv sync --extra dev
      - name: Ruff
        working-directory: pipeline
        run: uv run ruff check .
      - name: Mypy
        working-directory: pipeline
        run: uv run mypy
      - name: Pytest
        working-directory: pipeline
        run: uv run pytest

  web:
    needs: detect-web
    if: needs.detect-web.outputs.web_exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Vitest
        run: npx vitest run
