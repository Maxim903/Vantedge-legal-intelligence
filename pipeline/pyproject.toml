[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vil-pipeline"
version = "0.1.0"
description = "Pipeline de données pour Vantedge Legal Intelligence"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "structlog",
    "typer",
    "tenacity",
    "httpx",
    "google-cloud-bigquery",
    "google-cloud-storage",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
    "ruff",
    "mypy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/vil_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=vil_pipeline --cov-report=term-missing --cov-fail-under=80"
